name: Vintage harness tests

on:
  push:
    branches:
      - research/vintage-compressor-reference
      - ci/run-vintage-harness-tests
  pull_request:
    branches:
      - research/vintage-compressor-reference
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vintage-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run vintage harness tests
        run: python -m pytest -q test_vintage_harness.py
